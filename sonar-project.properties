# =============================================================================
# sonar-project.properties  ->  va en la RAIZ del repo de cada plugin
# =============================================================================
# La clave de proyecto y el nombre los ve el auditor en el dashboard, conviene
# que coincidan con el nombre del repo/plugin. Si arrancás un plugin nuevo a
# partir de este esqueleto, actualizalos.

sonar.projectKey=opensa-glpi-plugins-grafana
sonar.projectName=Grafana (GLPI plugin)
sonar.projectVersion=1.0

# --- Codigo a analizar ---------------------------------------------------------
# Fuente real del plugin. Incluimos ajax/, front/, src/, tools/ y los dos
# archivos de entrada del plugin. Si el plugin agrega otras carpetas (inc/, etc.),
# sumalas acá.
sonar.sources=ajax,front,src,tools,hook.php,setup.php

# Tests separados (SonarQube los trata distinto, no cuenta sus hallazgos como del producto)
sonar.tests=tests

# --- Exclusiones ---------------------------------------------------------------
# No analizar dependencias de terceros ni stubs; eso lo cubre "composer audit" (SCA),
# no el SAST de nuestro codigo.
sonar.exclusions=vendor/**,stubs/**,templates/**,**/*.twig

# --- PHP -----------------------------------------------------------------------
sonar.php.file.suffixes=php
sonar.sourceEncoding=UTF-8

# --- (Opcional) Integrar resultados de otras herramientas ----------------------
# Si mas adelante generas reportes de cobertura o de PHPStan en formato compatible,
# se importan aca. Por ahora los dejamos comentados.
# sonar.php.coverage.reportPaths=coverage/clover.xml
# sonar.php.phpstan.reportPaths=phpstan-report.json

# --- Falsos positivos de naming (convencion de hooks de GLPI) ------------------
# hook.php y setup.php son, casi en su totalidad, funciones y variables cuyo
# nombre exacto lo impone GLPI (plugin_<nombre>_install, plugin_<nombre>_check_config,
# el global $PLUGIN_HOOKS, etc.) - no es un estilo que elegimos nosotros, y
# renombrarlas rompe el mecanismo de hooks del framework. Se excluyen puntualmente
# estas dos reglas de naming solo en estos dos archivos; el resto del plugin
# sigue chequeado normalmente.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4

sonar.issue.ignore.multicriteria.e1.ruleKey=php:S100
sonar.issue.ignore.multicriteria.e1.resourceKey=**/hook.php

sonar.issue.ignore.multicriteria.e2.ruleKey=php:S100
sonar.issue.ignore.multicriteria.e2.resourceKey=**/setup.php

sonar.issue.ignore.multicriteria.e3.ruleKey=php:S117
sonar.issue.ignore.multicriteria.e3.resourceKey=**/setup.php

# --- Falso positivo de idioma (S1135 "TODO") -----------------------------------
# La regla busca el token "TODO" en cualquier comentario tratando solo [A-Za-z]
# como limite de palabra; como tildes/enie no cuentan como limite, "todo"/"todos"
# en comentarios en espanol siempre matchean. No tiene parametro para excluir el
# keyword (esta hardcodeado en el motor), asi que se excluye la regla entera en
# todo el proyecto en vez de evitar la palabra "todo" en los comentarios.
sonar.issue.ignore.multicriteria.e4.ruleKey=php:S1135
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*
